schema_version: "1.1"
name: no-avatar-build-story
expected_outcome: |
  The agent asks the intake questions (story/script, footage, narrator kind, voice, languages/formats) before
  building, does not assume an on-screen character, runs a voice-casting round with measured samples and
  waits for the user's choice, then delivers 16:9 and 9:16 MP4s with a cold open, word-timed yellow captions,
  a calm badge/none narrator, real screenshots with every private detail masked, music without Content ID
  cut on the beat, and an honest summary of what was and wasn't verified.
---
tags: [video, remotion, end-to-end, intake]
max_turns: 400
timeout_seconds: 10800
allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
